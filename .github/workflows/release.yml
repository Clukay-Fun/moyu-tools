name: release-windows
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-windows-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve base version
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if TAG=$(gh api repos/Clukay-Fun/moyu-tools/releases/latest --jq '.tag_name' 2>/dev/null); then
            echo "latest release tag: $TAG"
          else
            TAG="v$(node -p "require('./package.json').version")"
            echo "no latest release, using package.json: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.tag }}"
          BASE="${BASE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          PATCH=$((10#$PATCH + 1))
          VERSION="$MAJOR.$MINOR.$PATCH"
          node -e "const fs=require('fs');const f='package.json';const p=require('./'+f);p.version='$VERSION';fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n');const lf='package-lock.json';const L=JSON.parse(fs.readFileSync(lf,'utf8'));if(L.version)L.version='$VERSION';if(L.packages&&L.packages[''])L.packages[''].version='$VERSION';fs.writeFileSync(lf, JSON.stringify(L,null,2)+'\n');"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag is available
        id: tag_guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $TAG" >&2
            exit 1
          fi
          echo "safe_to_cleanup=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Build and publish (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win:release

      - name: Validate release assets
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          RELEASE_ID=""
          for ATTEMPT in {1..12}; do
            RELEASE_ID=$(gh api repos/Clukay-Fun/moyu-tools/releases --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
            [ -n "$RELEASE_ID" ] && break
            echo "waiting for draft release metadata ($ATTEMPT/12)"
            sleep 5
          done
          test -n "$RELEASE_ID"
          ASSETS=$(gh api "repos/Clukay-Fun/moyu-tools/releases/$RELEASE_ID/assets" --jq '.[].name')
          grep -Eq 'setup\.exe$' <<< "$ASSETS"
          grep -Fxq 'latest.yml' <<< "$ASSETS"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "repos/Clukay-Fun/moyu-tools/releases/${{ steps.release.outputs.id }}" -F draft=false

      - name: Cleanup on failure
        if: failure() && steps.tag_guard.outputs.safe_to_cleanup == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          RELEASE_ID=$(gh api repos/Clukay-Fun/moyu-tools/releases --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -n "$RELEASE_ID" ]; then
            gh api --method DELETE "repos/Clukay-Fun/moyu-tools/releases/$RELEASE_ID" || true
          fi
          git push --delete origin "${{ steps.bump.outputs.tag }}" || true
