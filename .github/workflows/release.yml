name: release-windows
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-windows
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve base version
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if TAG=$(gh api repos/Clukay-Fun/moyu-tools/releases/latest --jq '.tag_name' 2>/dev/null); then
            echo "latest release tag: $TAG"
          else
            TAG=""
            echo "no latest release; release notes will use recent commits"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release tag and package versions
        id: bump
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")

          if [ "$TAG" != "v$PACKAGE_VERSION" ] || [ "$LOCK_VERSION" != "$PACKAGE_VERSION" ] || [ "$LOCK_ROOT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag, package.json and package-lock.json versions must match (tag=$TAG, package=$PACKAGE_VERSION, lock=$LOCK_VERSION, lock root=$LOCK_ROOT_VERSION)"
            exit 1
          fi

          if ! node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.argv[1])) process.exit(1)' "$VERSION"; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH format: $TAG"
            exit 1
          fi

          BASE_TAG="${{ steps.base.outputs.tag }}"
          if [ -n "$BASE_TAG" ]; then
            BASE_VERSION="${BASE_TAG#v}"
            if ! node -e 'const parse = (v) => v.split(".").map(Number); const a = parse(process.argv[1]); const b = parse(process.argv[2]); for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) process.exit(a[i] > b[i] ? 0 : 1) } process.exit(1)' "$VERSION" "$BASE_VERSION"; then
              echo "::error::Release version $VERSION must be greater than latest release $BASE_TAG"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag is available
        id: tag_guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          EXISTING=$(gh api repos/Clukay-Fun/moyu-tools/releases --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | tr -d '\r')
          if [ -n "$EXISTING" ]; then
            echo "a GitHub release already exists for tag: $TAG" >&2
            exit 1
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tag must point to a commit already merged into main"
            exit 1
          fi
          echo "safe_to_cleanup=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Build local release assets
        run: npm run build:win:nsis

      - name: Generate installer SHA-256 checksum
        shell: bash
        run: |
          INSTALLER="release/moyu-tools-${{ steps.bump.outputs.tag }}-windows-x64-setup.exe"
          node - "$INSTALLER" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const file = process.argv[2]
          const hash = crypto.createHash('sha256')
          const stream = fs.createReadStream(file)
          stream.on('data', (chunk) => hash.update(chunk))
          stream.on('error', (error) => { console.error(error); process.exitCode = 1 })
          stream.on('end', () => {
            const line = `${hash.digest('hex')}  ${path.basename(file)}\n`
            fs.writeFileSync(`${file}.sha256`, line, 'utf8')
          })
          NODE

      - name: Prepare release notes
        shell: bash
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          if [ -n "$BASE_TAG" ] && git rev-parse --quiet --verify "${BASE_TAG}^{commit}" >/dev/null; then
            SUBJECTS=$(git log --no-merges --reverse --format='%s' "${BASE_TAG}..HEAD")
          else
            SUBJECTS=$(git log --no-merges --reverse --format='%s' -n 20 HEAD)
          fi

          NEW_ITEMS=()
          IMPROVED_ITEMS=()
          FIXED_ITEMS=()
          OTHER_ITEMS=()
          while IFS= read -r SUBJECT; do
            [ -n "$SUBJECT" ] || continue
            if [[ "$SUBJECT" == "chore(release):"* ]]; then
              continue
            fi
            if [[ "$SUBJECT" == *:* ]]; then
              HEADER="${SUBJECT%%:*}"
              TYPE="${HEADER%%(*}"
              SUMMARY="${SUBJECT#*:}"
              SUMMARY="${SUMMARY# }"
            else
              TYPE="other"
              SUMMARY="$SUBJECT"
            fi

            case "$TYPE" in
              feat) NEW_ITEMS+=("$SUMMARY") ;;
              fix) FIXED_ITEMS+=("$SUMMARY") ;;
              style|perf|refactor) IMPROVED_ITEMS+=("$SUMMARY") ;;
              *) OTHER_ITEMS+=("$SUMMARY") ;;
            esac
          done <<< "$SUBJECTS"

          {
            echo '## 更新内容'
            if ((${#NEW_ITEMS[@]})); then
              echo
              echo '### 新增'
              printf -- '- %s\n' "${NEW_ITEMS[@]}"
            fi
            if ((${#IMPROVED_ITEMS[@]})); then
              echo
              echo '### 改进'
              printf -- '- %s\n' "${IMPROVED_ITEMS[@]}"
            fi
            if ((${#FIXED_ITEMS[@]})); then
              echo
              echo '### 修复'
              printf -- '- %s\n' "${FIXED_ITEMS[@]}"
            fi
            if ((${#OTHER_ITEMS[@]})); then
              echo
              echo '### 其他调整'
              printf -- '- %s\n' "${OTHER_ITEMS[@]}"
            fi
          } > release-notes.md

          if ! grep -qE '^- ' release-notes.md; then
            echo '::error::Release notes are empty; add descriptive commits before publishing.'
            exit 1
          fi

      # electron-builder can create two same-tag drafts concurrently for different
      # assets. Own creation/upload here so every asset belongs to one release.
      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          BODY="$(cat release-notes.md)"
          test -s "release/moyu-tools-${TAG}-windows-x64-setup.exe"
          test -s release/latest.yml
          RELEASE_ID=$(gh api --method POST repos/Clukay-Fun/moyu-tools/releases \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$TAG" \
            -f body="$BODY" \
            -F draft=true -F prerelease=false --jq '.id' | tr -d '\r')
          test -n "$RELEASE_ID"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          OWN_ID="${{ steps.draft.outputs.id }}"
          INSTALLER="release/moyu-tools-${TAG}-windows-x64-setup.exe"
          FILES=("$INSTALLER" "$INSTALLER.sha256" release/latest.yml)
          BLOCKMAP="$INSTALLER.blockmap"
          if [ -s "$BLOCKMAP" ]; then FILES+=("$BLOCKMAP"); fi
          for ATTEMPT in 1 2 3; do
            # 刚创建的 release 立刻拿列表接口查，可能还没来得及出现（读己之写在
            # 创建/列表这两个不同接口间不保证同步）——查到空不代表歧义，只有
            # 查到「别的」id 才是真的歧义。用 Create draft release 那次 POST
            # 响应里拿到的 id 本身已经是权威的，不需要靠列表接口反过来确认。
            IDS=$(gh api repos/Clukay-Fun/moyu-tools/releases --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | tr -d '\r')
            OTHER=$(printf '%s\n' "$IDS" | grep -vFx "$OWN_ID" | grep -v '^$' || true)
            if [ -n "$OTHER" ]; then
              echo "::error::Release identity is ambiguous; refusing upload (found: $OTHER)"
              exit 1
            fi
            if gh release upload "$TAG" "${FILES[@]}" --clobber; then exit 0; fi
            if [ "$ATTEMPT" -lt 3 ]; then sleep 10; fi
          done
          exit 1

      - name: Validate release assets
        id: release
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          RELEASE_ID="${{ steps.draft.outputs.id }}"
          ASSETS=""
          EXPECTED_INSTALLER="moyu-tools-${TAG}-windows-x64-setup.exe"
          EXPECTED_CHECKSUM="$EXPECTED_INSTALLER.sha256"
          READY=false
          for ATTEMPT in {1..60}; do
            # Windows gh output can contain CRLF; normalize before exact matching.
            ASSETS=""
            if [ -n "$RELEASE_ID" ]; then
              if ! ASSETS=$(gh api "repos/Clukay-Fun/moyu-tools/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.state == "uploaded" and .size > 0) | .name' | tr -d '\r'); then
                echo "::warning::Release assets request failed; retrying"
                ASSETS=""
              fi
              if grep -Fxq "$EXPECTED_INSTALLER" <<< "$ASSETS" && grep -Fxq "$EXPECTED_CHECKSUM" <<< "$ASSETS" && grep -Fxq 'latest.yml' <<< "$ASSETS"; then
                READY=true
                break
              fi
            fi
            echo "waiting for uploaded release assets ($ATTEMPT/60): ${ASSETS:-none}"
            if [ "$ATTEMPT" -lt 60 ]; then sleep 10; fi
          done
          if [ "$READY" != true ]; then
            echo "::error::Release $TAG assets did not become ready within the polling window"
            for REQUIRED in "$EXPECTED_INSTALLER" "$EXPECTED_CHECKSUM" latest.yml; do
              if ! grep -Fxq "$REQUIRED" <<< "$ASSETS"; then
                echo "::error::Missing uploaded asset: $REQUIRED"
              fi
            done
            exit 1
          fi
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "repos/Clukay-Fun/moyu-tools/releases/${{ steps.release.outputs.id }}" -F draft=false

      - name: Cleanup on failure
        if: failure() && steps.draft.outputs.id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.draft.outputs.id }}"
          IS_DRAFT=$(gh api "repos/Clukay-Fun/moyu-tools/releases/$RELEASE_ID" --jq '.draft' | tr -d '\r')
          if [ "$IS_DRAFT" = true ]; then
            gh api --method DELETE "repos/Clukay-Fun/moyu-tools/releases/$RELEASE_ID"
          else
            echo "Release is already public; preserving it and its tag"
          fi
