<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <title>选择截图区域</title>
    <link rel="stylesheet" href="./screenshot.css" />
  </head>
  <body>
    <canvas id="capture-canvas"></canvas>
    <canvas class="capture-magnifier" id="capture-magnifier" width="128" height="152" hidden></canvas>
    <div class="selection-size" id="selection-size" hidden></div>
    <div class="capture-toolbar" id="capture-toolbar" hidden>
      <button data-tool="rectangle" aria-label="矩形" data-tip="矩形"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-tool-rect"></use></svg></button>
      <button data-tool="ellipse" aria-label="椭圆" data-tip="圆形"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-tool-ellipse"></use></svg></button>
      <button data-tool="arrow" aria-label="箭头" data-tip="箭头"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-tool-arrow"></use></svg></button>
      <button data-tool="brush" aria-label="画笔" data-tip="涂鸦"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-tool-doodle"></use></svg></button>
      <button data-tool="text" aria-label="文字" data-tip="文字"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-tool-text"></use></svg></button>
      <button data-tool="mosaic" aria-label="马赛克" data-tip="马赛克"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-tool-mosaic"></use></svg></button>
      <i></i>
      <button id="annotation-color" aria-label="标注颜色" data-tip="颜色"><span class="annotation-swatch"></span></button>
      <button id="annotation-width" aria-label="标注粗细" data-tip="粗细"><span class="annotation-width-preview"></span></button>
      <button id="undo-capture" aria-label="撤销" data-tip="撤销" disabled><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-undo"></use></svg></button>
      <button id="redo-capture" aria-label="重做" data-tip="重做" disabled><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-redo"></use></svg></button>
      <i></i>
      <button id="pin-capture" aria-label="钉在桌面" data-tip="钉住"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-pin"></use></svg></button>
      <button id="ocr-capture" aria-label="提取文本" data-tip="提取文本"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-action-ocr"></use></svg></button>
      <button id="copy-capture" aria-label="复制" data-tip="复制"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-copy"></use></svg></button>
      <button id="save-capture" aria-label="保存" data-tip="另存为"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-download"></use></svg></button>
      <button id="cancel-capture" aria-label="取消" data-tip="取消"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-close"></use></svg></button>
      <button class="primary" id="confirm-capture" aria-label="完成" data-tip="完成"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-check"></use></svg></button>
    </div>
    <div class="capture-popover" id="capture-popover" hidden></div>
    <textarea class="capture-text-editor" id="capture-text-editor" aria-label="标注文字" placeholder="输入文字，Ctrl/⌘+Enter 完成" hidden></textarea>
    <div class="capture-tip" id="capture-tip">拖动选择截图区域 · Esc 取消</div>
    <script type="module" src="./screenshot.js"></script>
  </body>
</html>
