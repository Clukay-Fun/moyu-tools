<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钉住截图</title>
    <link rel="stylesheet" href="./pin.css" />
  </head>
  <body>
    <main class="pin-frame" id="pin-frame">
      <img id="pin-image" alt="钉住的截图" />
      <div class="pin-loading" id="pin-loading">正在载入截图…</div>
      <div class="pin-controls" aria-label="钉图控制">
        <button id="pin-opacity-down" aria-label="降低不透明度" type="button" data-tip="降低透明度"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-opacity-down"></use></svg></button>
        <button id="pin-opacity-up" aria-label="提高不透明度" type="button" data-tip="提高透明度"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-opacity-up"></use></svg></button>
        <button id="pin-zoom-out" aria-label="缩小" type="button" data-tip="缩小"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-zoom-out"></use></svg></button>
        <button id="pin-zoom-in" aria-label="放大" type="button" data-tip="放大"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-zoom-in"></use></svg></button>
        <button id="pin-copy" type="button" aria-label="复制" data-tip="复制">复制</button>
        <button id="pin-close" aria-label="关闭" type="button" data-tip="关闭"><svg class="ic" aria-hidden="true" focusable="false"><use href="#ic-close"></use></svg></button>
      </div>
      <output id="pin-status" aria-live="polite"></output>
    </main>
    <script type="module" src="./pin.js"></script>
  </body>
</html>
